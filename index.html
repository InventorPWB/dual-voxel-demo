<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dual Voxel Demo</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="view"></canvas>

    <div id="hud">
      <div id="crosshair"></div>
      <div id="itemname"></div>
      <div id="hotbar" class="panel"></div>
      <div id="toast"></div>
      <pre id="stats" class="panel" hidden></pre>
      <div id="help" class="panel" hidden>
        <h3>Controls</h3>
        <div class="controls"></div>
      </div>
    </div>

    <div id="inventory" class="panel" hidden>
      <div class="head"><h3>Inventory</h3><span class="hover"></span></div>
      <p class="sub">Click an item to put it in the selected hotbar slot, or drag it onto a slot. E to close.</p>
      <div class="section">Tools</div>
      <div class="tools"></div>
      <div class="section">Plants</div>
      <div class="tools plants"></div>
      <div class="section">Building</div>
      <div class="grid"></div>
    </div>

    <div id="hint" class="panel"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
